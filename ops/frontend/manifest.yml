apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: frontend
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Kubernetes Full-Stack Demo</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 32px; max-width: 560px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h1 { font-size: 24px; margin-bottom: 8px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .badge { background: #0284c7; color: white; font-size: 12px; padding: 4px 10px; border-radius: 9999px; font-weight: 600; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .flow { background: #0f172a; border-radius: 10px; padding: 14px; font-family: monospace; font-size: 13px; color: #a5f3fc; margin-bottom: 24px; border: 1px solid #1e293b; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #7dd3fc; }
        #output { background: #0f172a; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #4ade80; max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Kubernetes Gateway <span class="badge">Live</span></h1>
        <p>This frontend is in the <strong>frontend</strong> namespace, served by an internal NGINX Pod via ConfigMap.</p>
        <div class="flow">
          Client ➔ Reverse-Proxy (LoadBalancer:80)<br>
          &nbsp;&nbsp;├── / ➔ frontend.frontend.svc.cluster.local:80<br>
          &nbsp;&nbsp;└── /users ➔ backend.default.svc.cluster.local:3000 ➔ PostgreSQL:5432
        </div>
        <div class="btn-group">
          <button onclick="fetchUsers()">Fetch Users from Backend</button>
        </div>
        <div id="output">Click above to query /users through the NGINX reverse proxy...</div>
      </div>
      <script>
        async function fetchUsers() {
          const out = document.getElementById('output');
          out.textContent = "Loading...";
          try {
            const res = await fetch('/users');
            const data = await res.json();
            out.textContent = JSON.stringify(data, null, 2);
          } catch (err) {
            out.textContent = "Error: " + err.message;
          }
        }
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
