apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: frontend
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Frontend</title>
    </head>
    <body>
      <h1>Frontend</h1>
      <button onclick="fetchUsers()">Fetch Users</button>
      <pre id="output"></pre>

      <script>
        async function fetchUsers() {
          try {
            const res = await fetch('/users');
            const data = await res.json();
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
          } catch (err) {
            document.getElementById('output').textContent = 'Error: ' + err.message;
          }
        }
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
